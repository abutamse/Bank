<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mein Bankbuch</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#0f1115;
    --card:#171a21;
    --card2:#1f232c;
    --border:#2a2f3a;
    --text:#eef1f5;
    --muted:#8b93a3;
    --accent:#3ddc84;
    --danger:#ff5c6c;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:60px 12px 60px;
  }
  body[dir="rtl"]{ text-align:right; }
  #lang-bar{
    position:fixed;
    top:12px;
    right:12px;
    z-index:50;
  }
  body[dir="rtl"] #lang-bar{ right:auto; left:12px; }
  #lang-toggle{ padding:8px 12px; font-size:.85rem; }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    width:100%;
    max-width:480px;
    margin-bottom:16px;
  }
  h1{font-size:1.4rem;margin:0 0 12px;}
  h2{font-size:1rem;color:var(--muted);margin:22px 0 10px;text-transform:uppercase;letter-spacing:.04em;}
  .hidden{display:none !important;}
  .muted{color:var(--muted);font-size:.85rem;}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  select,input[type=text],input[type=password],input[type=number]{
    width:100%;
    background:var(--card2);
    border:1px solid var(--border);
    color:var(--text);
    padding:11px 12px;
    border-radius:10px;
    font-size:1rem;
    margin-bottom:10px;
  }
  form{display:flex;flex-direction:column;}
  button{
    background:var(--accent);
    color:#04140a;
    border:none;
    padding:12px 16px;
    border-radius:10px;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
  }
  button.ghost{
    background:transparent;
    color:var(--text);
    border:1px solid var(--border);
    font-weight:500;
  }
  button.small{padding:8px 12px;font-size:.85rem;width:auto;}
  hr{border:none;border-top:1px solid var(--border);margin:16px 0;}
  .error{color:var(--danger);font-size:.85rem;}
  .pos{color:var(--accent);}
  .neg{color:var(--danger);}
  .big{font-size:2.2rem;font-weight:700;margin:4px 0 0;}
  .balance-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);gap:8px;}
  .balance-row:last-child{border-bottom:none;}
  .balance-row .name-amount{display:flex;flex-direction:column;}
  .tx-row{padding:10px 0;border-bottom:1px solid var(--border);}
  .tx-row:last-child{border-bottom:none;}
  .tx-row.send{border-left:3px solid var(--accent);padding-left:10px;}
  .tx-row.take{border-left:3px solid var(--danger);padding-left:10px;}
  body[dir="rtl"] .tx-row.send{border-left:none;border-right:3px solid var(--accent);padding-left:0;padding-right:10px;}
  body[dir="rtl"] .tx-row.take{border-left:none;border-right:3px solid var(--danger);padding-left:0;padding-right:10px;}
  .tx-row .del-tx{margin-top:6px;background:var(--danger);color:#fff;padding:6px 10px;font-size:.8rem;width:auto;}
  table.items{width:100%;border-collapse:collapse;margin:6px 0;font-size:.85rem;}
  table.items td{padding:3px 0;color:var(--muted);}
  table.items td:last-child{text-align:right;color:var(--text);}
  body[dir="rtl"] table.items td:last-child{text-align:left;}
  .receipt-row{
    display:grid;
    grid-template-columns:2fr 1fr 1fr auto auto;
    gap:6px;
    align-items:center;
    margin-bottom:6px;
  }
  .receipt-row input{margin-bottom:0;}
  .receipt-row .subtotal{font-size:.85rem;color:var(--muted);white-space:nowrap;}
  .receipt-row .del-row{background:var(--danger);color:#fff;padding:8px;width:auto;}
  #popup-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.6);
    display:flex;align-items:center;justify-content:center;
    z-index:100;
    padding:20px;
  }
  .popup-box{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:24px;
    max-width:380px;
    width:100%;
    text-align:center;
  }
  .popup-box button{width:100%;margin-top:14px;}
</style>
</head>
<body>

<div id="lang-bar"><button id="lang-toggle" class="ghost small">العربية</button></div>

<div id="popup-overlay" class="hidden">
  <div id="popup-content" class="popup-box"></div>
</div>

<div id="view-login" class="view hidden">
  <div class="card">
    <h1 data-i18n="loginTitle">🏦 Anmelden</h1>
    <form id="login-form">
      <input type="text" id="login-username" data-i18n-placeholder="username" placeholder="Benutzername" required autocomplete="username">
      <input type="password" id="login-password" data-i18n-placeholder="password" placeholder="Passwort" required autocomplete="current-password">
      <button type="submit" data-i18n="loginBtn">Einloggen</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>
</div>

<div id="view-admin" class="view hidden">
  <div class="card">
    <div class="row-between"><h1 data-i18n="adminTitle">🏦 Admin</h1><button id="admin-logout" class="ghost small" data-i18n="logout">Abmelden</button></div>

    <h2 data-i18n="overview">Übersicht</h2>
    <div id="admin-overview"></div>

    <h2 data-i18n="person">Person</h2>
    <div class="row-between">
      <select id="admin-person-select"></select>
      <button id="admin-add-person" class="ghost small" data-i18n="addNew">+ Neu</button>
    </div>

    <h2 data-i18n="quickAction">Schnellaktion</h2>
    <form id="admin-quick-form">
      <select id="admin-type">
        <option value="send" data-i18n="send">Senden 💸 (er bekommt)</option>
        <option value="take" data-i18n="take">Nehmen 🪙 (er verliert)</option>
      </select>
      <input type="number" id="admin-amount" step="1" min="0" data-i18n-placeholder="amount" placeholder="Betrag" required>
      <input type="text" id="admin-note" data-i18n-placeholder="note" placeholder="Notiz (optional)">
      <button type="submit" data-i18n="execute">Ausführen</button>
    </form>

    <h2 data-i18n="calculator">🧮 Taschenrechner / Quittung</h2>
    <div id="receipt-rows"></div>
    <button type="button" id="receipt-add-row" class="ghost small" data-i18n="addPosition">+ Position</button>
    <div class="row-between" style="margin-top:10px;"><b data-i18n="sum">Summe:</b><span id="receipt-total">0 ل.س</span></div>
    <select id="receipt-type">
      <option value="send" data-i18n="send">Senden 💸 (er bekommt)</option>
      <option value="take" data-i18n="take">Nehmen 🪙 (er verliert)</option>
    </select>
    <button type="button" id="receipt-send" data-i18n="sendReceipt">Quittung senden</button>

    <h2 data-i18n="historyAll">Verlauf (alle)</h2>
    <div id="admin-history"></div>
  </div>
</div>

<div id="view-person" class="view hidden">
  <div class="card">
    <div class="row-between"><h1 id="person-name"></h1><button id="person-switch" class="ghost small" data-i18n="logout">Abmelden</button></div>
    <p class="muted" data-i18n="currentBalance">Aktueller Stand</p>
    <p id="person-balance" class="big"></p>
    <h2 data-i18n="history">Verlauf</h2>
    <div id="person-history"></div>
  </div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* ========================================================
   KONFIGURATION – kann so auf GitHub liegen, ist ja nichts geheimes
   ======================================================== */
const SUPABASE_URL = "https://beekurnprkvehylgztaa.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlZWt1cm5wcmt2ZWh5bGd6dGFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5OTYxNTgsImV4cCI6MjEwNDU3MjE1OH0.2HrHDtst8K2ZCJVqvLdpnSjoGiV6j9mw7jlofD9Yif8";
const ADMIN_USERNAME = "abody";
const ADMIN_PASSWORD = "abody4457018"; // <-- HIER DEIN EIGENES PASSWORT EINTRAGEN
/* ======================================================== */

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------------- ÜBERSETZUNGEN ---------------- */
const translations = {
  de: {
    loginTitle:"🏦 Anmelden", username:"Benutzername", password:"Passwort", loginBtn:"Einloggen",
    loginError:"Benutzername oder Passwort falsch",
    adminTitle:"🏦 Admin", logout:"Abmelden", overview:"Übersicht", person:"Person",
    choosePerson:"– Person wählen –", addNew:"+ Neu", quickAction:"Schnellaktion",
    send:"Senden 💸 (er bekommt)", take:"Nehmen 🪙 (er verliert)", amount:"Betrag",
    note:"Notiz (optional)", execute:"Ausführen", calculator:"🧮 Taschenrechner / Quittung",
    addPosition:"+ Position", itemName:"Name der Sache", qty:"Anzahl", pricePerUnit:"Preis/Stk",
    sum:"Summe:", sendReceipt:"Quittung senden", historyAll:"Verlauf (alle)",
    noPersons:"Noch keine Personen.", noTx:"Noch keine Transaktionen.", delete:"Löschen",
    confirmDelete:"Wirklich löschen?", currentBalance:"Aktueller Stand", history:"Verlauf",
    received:"💸 Erhalten", debited:"🪙 Abgebucht", moneyReceived:"💸 Geld erhalten",
    moneyDebited:"🪙 Geld abgebucht", ok:"OK", receiptSent:"Quittung gesendet!",
    choosePersonFirst:"Bitte zuerst eine Person wählen", invalidAmount:"Bitte gültigen Betrag eingeben",
    noPositions:"Keine Positionen eingetragen", error:"Fehler: ",
    newPersonName:"Name der neuen Person (das ist auch ihr Login-Benutzername):",
    newPersonPassword:"Passwort für diese Person:", sentWord:"gesendet", takenWord:"genommen",
    receiptNoteDefault:"Quittung", changePassword:"🔑", newPasswordPrompt:"Neues Passwort für"
  },
  ar: {
    loginTitle:"🏦 تسجيل الدخول", username:"اسم المستخدم", password:"كلمة المرور", loginBtn:"دخول",
    loginError:"اسم المستخدم أو كلمة المرور غير صحيحة",
    adminTitle:"🏦 المدير", logout:"تسجيل الخروج", overview:"نظرة عامة", person:"الشخص",
    choosePerson:"- اختر شخصاً -", addNew:"+ جديد", quickAction:"إجراء سريع",
    send:"إرسال 💸 (يستلم)", take:"سحب 🪙 (يخسر)", amount:"المبلغ",
    note:"ملاحظة (اختياري)", execute:"تنفيذ", calculator:"🧮 الحاسبة / الإيصال",
    addPosition:"+ إضافة عنصر", itemName:"اسم الشيء", qty:"العدد", pricePerUnit:"السعر/الوحدة",
    sum:"المجموع:", sendReceipt:"إرسال الإيصال", historyAll:"السجل (الكل)",
    noPersons:"لا يوجد أشخاص بعد.", noTx:"لا توجد معاملات بعد.", delete:"حذف",
    confirmDelete:"هل تريد الحذف فعلاً؟", currentBalance:"الرصيد الحالي", history:"السجل",
    received:"💸 تم الاستلام", debited:"🪙 تم الخصم", moneyReceived:"💸 تم استلام المال",
    moneyDebited:"🪙 تم خصم المال", ok:"موافق", receiptSent:"تم إرسال الإيصال!",
    choosePersonFirst:"الرجاء اختيار شخص أولاً", invalidAmount:"الرجاء إدخال مبلغ صحيح",
    noPositions:"لم يتم إدخال أي عناصر", error:"خطأ: ",
    newPersonName:"اسم الشخص الجديد (وهو أيضاً اسم المستخدم لتسجيل الدخول):",
    newPersonPassword:"كلمة المرور لهذا الشخص:", sentWord:"أرسل", takenWord:"أخذ",
    receiptNoteDefault:"إيصال", changePassword:"🔑", newPasswordPrompt:"كلمة مرور جديدة لـ"
  }
};
let currentLang = localStorage.getItem('bankapp_lang') || 'de';
function t(key){ return (translations[currentLang] && translations[currentLang][key]) || key; }
function applyLang(){
  document.documentElement.lang = currentLang;
  document.body.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{ el.placeholder = t(el.dataset.i18nPlaceholder); });
  $('#lang-toggle').textContent = currentLang === 'ar' ? 'Deutsch' : 'العربية';
  // dynamische Inhalte neu rendern, falls schon geladen
  if(!$('#view-admin').classList.contains('hidden')){ renderAdminOverview(); renderAdminPersonSelect(); renderAdminHistory(); }
  if(!$('#view-person').classList.contains('hidden')){ refreshPersonData(); }
}

/* ---------------- HELFER ---------------- */
const $ = sel => document.querySelector(sel);
const $$ = sel => document.querySelectorAll(sel);
function show(id){ $$('.view').forEach(v=>v.classList.add('hidden')); $(id).classList.remove('hidden'); }
function fmt(n){ return Math.round(n||0).toLocaleString('de-DE') + ' ل.س'; }
function fmtDate(d){ return new Date(d).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function renderItemsTable(items){
  return `<table class="items"><tbody>${items.map(i=>`<tr><td>${i.qty}x ${i.name}</td><td>${fmt(i.qty*i.price)}</td></tr>`).join('')}</tbody></table>`;
}
function getSession(){ try{ return JSON.parse(localStorage.getItem('bankapp_session')||'null'); }catch{ return null; } }
function setSession(obj){ localStorage.setItem('bankapp_session', JSON.stringify(obj)); }
function clearSession(){ localStorage.removeItem('bankapp_session'); }

$('#lang-toggle').addEventListener('click', ()=>{
  currentLang = currentLang === 'ar' ? 'de' : 'ar';
  localStorage.setItem('bankapp_lang', currentLang);
  applyLang();
});

let receiptRows = [];

/* ---------------- ROUTER ---------------- */
async function route(){
  applyLang();
  const session = getSession();
  if(session && session.type==='admin') return openAdmin();
  if(session && session.type==='person') return openPerson(session.id);
  show('#view-login');
}

/* ---------------- LOGIN ---------------- */
$('#login-form').addEventListener('submit', async e=>{
  e.preventDefault();
  $('#login-error').textContent = '';
  const username = $('#login-username').value.trim();
  const password = $('#login-password').value;

  if(username.toLowerCase() === ADMIN_USERNAME.toLowerCase() && password === ADMIN_PASSWORD){
    setSession({type:'admin'});
    $('#login-form').reset();
    return openAdmin();
  }

  // Normale Personen: Name + gespeichertes Passwort müssen passen
  const { data: person } = await supabase.from('persons').select('*').ilike('name', username).maybeSingle();
  if(person && person.password && person.password === password){
    setSession({type:'person', id: person.id});
    $('#login-form').reset();
    return openPerson(person.id);
  }
  $('#login-error').textContent = t('loginError');
});

/* ---------------- ADMIN ---------------- */
let allPersons = [], allTx = [], selectedPersonId = null;

async function openAdmin(){
  show('#view-admin');
  await refreshAdminData();
}
async function refreshAdminData(){
  const [{data: persons}, {data: tx}] = await Promise.all([
    supabase.from('persons').select('*').order('name'),
    supabase.from('transactions').select('*').order('created_at', {ascending:false})
  ]);
  allPersons = persons || [];
  allTx = tx || [];
  renderAdminOverview();
  renderAdminPersonSelect();
  renderAdminHistory();
}
function balanceFor(personId){
  return allTx.filter(t=>t.person_id===personId).reduce((s,t)=> s + (t.type==='send'? Number(t.amount) : -Number(t.amount)), 0);
}
function renderAdminOverview(){
  $('#admin-overview').innerHTML = allPersons.map(p=>{
    const bal = balanceFor(p.id);
    return `<div class="balance-row">
      <span>${p.name}</span>
      <span style="display:flex;align-items:center;gap:8px;">
        <span class="${bal>=0?'pos':'neg'}">${fmt(bal)}</span>
        <button class="ghost small change-pw" data-id="${p.id}" data-name="${p.name}">${t('changePassword')}</button>
      </span>
    </div>`;
  }).join('') || `<p class="muted">${t('noPersons')}</p>`;
}
$('#admin-overview').addEventListener('click', async e=>{
  if(e.target.classList.contains('change-pw')){
    const pw = prompt(`${t('newPasswordPrompt')} ${e.target.dataset.name}:`);
    if(pw===null || pw==='') return;
    await supabase.from('persons').update({password: pw}).eq('id', e.target.dataset.id);
    refreshAdminData();
  }
});
function renderAdminPersonSelect(){
  const sel = $('#admin-person-select');
  const prev = sel.value;
  sel.innerHTML = `<option value="">${t('choosePerson')}</option>` + allPersons.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  if(prev) sel.value = prev;
  selectedPersonId = sel.value || null;
}
$('#admin-person-select').addEventListener('change', e=>{ selectedPersonId = e.target.value || null; });
$('#admin-add-person').addEventListener('click', async ()=>{
  const name = prompt(t('newPersonName'));
  if(!name) return;
  const pw = prompt(t('newPersonPassword'));
  if(!pw) return;
  const { error } = await supabase.from('persons').insert({ name: name.trim(), password: pw });
  if(error) return alert(t('error')+error.message);
  refreshAdminData();
});
$('#admin-quick-form').addEventListener('submit', async e=>{
  e.preventDefault();
  if(!selectedPersonId) return alert(t('choosePersonFirst'));
  const amount = parseFloat($('#admin-amount').value);
  const note = $('#admin-note').value.trim();
  const type = $('#admin-type').value;
  if(!amount || amount<=0) return alert(t('invalidAmount'));
  const { error } = await supabase.from('transactions').insert({ person_id: selectedPersonId, type, amount, note, seen:false });
  if(error) return alert(t('error')+error.message);
  $('#admin-quick-form').reset();
  refreshAdminData();
});

/* Taschenrechner / Quittung */
function renderReceiptRows(){
  const el = $('#receipt-rows');
  el.innerHTML = receiptRows.map((r,i)=>`
    <div class="receipt-row">
      <input type="text" placeholder="${t('itemName')}" value="${r.name}" data-i="${i}" data-f="name">
      <input type="number" min="0" step="1" placeholder="${t('qty')}" value="${r.qty}" data-i="${i}" data-f="qty">
      <input type="number" min="0" step="1" placeholder="${t('pricePerUnit')}" value="${r.price}" data-i="${i}" data-f="price">
      <span class="subtotal">${fmt(r.qty*r.price)}</span>
      <button type="button" class="del-row" data-i="${i}">✕</button>
    </div>`).join('');
  const total = receiptRows.reduce((s,r)=> s + r.qty*r.price, 0);
  $('#receipt-total').textContent = fmt(total);
}
$('#receipt-add-row').addEventListener('click', ()=>{ receiptRows.push({name:'',qty:1,price:0}); renderReceiptRows(); });
$('#receipt-rows').addEventListener('input', e=>{
  const i = e.target.dataset.i, f = e.target.dataset.f;
  if(i===undefined) return;
  receiptRows[i][f] = f==='name'? e.target.value : (parseFloat(e.target.value)||0);
  // Nur den Zwischensumme-Text aktualisieren, NICHT die Eingabefelder neu bauen
  // (sonst verliert das Feld den Fokus und die Tastatur klappt bei jedem Zeichen zu)
  const row = e.target.closest('.receipt-row');
  if(row){ row.querySelector('.subtotal').textContent = fmt(receiptRows[i].qty * receiptRows[i].price); }
  const total = receiptRows.reduce((s,r)=> s + r.qty*r.price, 0);
  $('#receipt-total').textContent = fmt(total);
});
$('#receipt-rows').addEventListener('click', e=>{
  if(e.target.classList.contains('del-row')){ receiptRows.splice(e.target.dataset.i,1); renderReceiptRows(); }
});
$('#receipt-send').addEventListener('click', async ()=>{
  if(!selectedPersonId) return alert(t('choosePersonFirst'));
  if(!receiptRows.length) return alert(t('noPositions'));
  const total = receiptRows.reduce((s,r)=> s + r.qty*r.price, 0);
  const type = $('#receipt-type').value;
  const { error } = await supabase.from('transactions').insert({
    person_id: selectedPersonId, type, amount: total, note: t('receiptNoteDefault'), items: receiptRows, seen:false
  });
  if(error) return alert(t('error')+error.message);
  receiptRows = []; renderReceiptRows();
  await refreshAdminData();
  alert(t('receiptSent'));
});
renderReceiptRows();

function renderAdminHistory(){
  $('#admin-history').innerHTML = allTx.map(tx=>{
    const p = allPersons.find(p=>p.id===tx.person_id);
    return `<div class="tx-row ${tx.type}">
      <div><b>${p?p.name:'?'}</b> – ${tx.type==='send'?t('sentWord'):t('takenWord')} – ${fmt(tx.amount)}</div>
      <div class="muted">${fmtDate(tx.created_at)} ${tx.note?'– '+tx.note:''}</div>
      ${tx.items? renderItemsTable(tx.items):''}
      <button class="del-tx" data-id="${tx.id}">${t('delete')}</button>
    </div>`;
  }).join('') || `<p class="muted">${t('noTx')}</p>`;
}
$('#admin-history').addEventListener('click', async e=>{
  if(e.target.classList.contains('del-tx')){
    if(!confirm(t('confirmDelete'))) return;
    await supabase.from('transactions').delete().eq('id', e.target.dataset.id);
    refreshAdminData();
  }
});
$('#admin-logout').addEventListener('click', ()=>{
  clearSession();
  show('#view-login');
});

/* ---------------- PERSON VIEW ---------------- */
let currentPerson = null, personChannel = null;

async function openPerson(id){
  show('#view-person');
  const { data: person } = await supabase.from('persons').select('*').eq('id', id).single();
  if(!person){ clearSession(); return show('#view-login'); }
  currentPerson = person;
  $('#person-name').textContent = person.name;
  await refreshPersonData();
  await showPendingPopups();
  subscribeRealtime();
}
async function refreshPersonData(){
  if(!currentPerson) return;
  const { data: tx } = await supabase.from('transactions').select('*').eq('person_id', currentPerson.id).order('created_at',{ascending:false});
  const list = tx || [];
  const balance = list.reduce((s,t)=> s + (t.type==='send'? Number(t.amount) : -Number(t.amount)), 0);
  $('#person-balance').textContent = fmt(balance);
  $('#person-balance').className = balance>=0? 'pos big':'neg big';
  $('#person-history').innerHTML = list.map(tx=>`
    <div class="tx-row ${tx.type}">
      <div>${tx.type==='send'?t('received'):t('debited')} – <b>${fmt(tx.amount)}</b></div>
      <div class="muted">${fmtDate(tx.created_at)} ${tx.note?'– '+tx.note:''}</div>
      ${tx.items? renderItemsTable(tx.items):''}
    </div>`).join('') || `<p class="muted">${t('noTx')}</p>`;
}
async function showPendingPopups(){
  const { data: pending } = await supabase.from('transactions').select('*').eq('person_id', currentPerson.id).eq('seen', false).order('created_at');
  for(const tx of (pending||[])){
    await new Promise(resolve=>{
      openPopup(tx, async ()=>{
        await supabase.from('transactions').update({seen:true}).eq('id', tx.id);
        resolve();
      });
    });
  }
}
function subscribeRealtime(){
  if(personChannel) supabase.removeChannel(personChannel);
  personChannel = supabase.channel('tx-'+currentPerson.id)
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'transactions', filter:`person_id=eq.${currentPerson.id}`}, payload=>{
      openPopup(payload.new, async ()=>{
        await supabase.from('transactions').update({seen:true}).eq('id', payload.new.id);
        refreshPersonData();
      });
    })
    .subscribe();
}
function openPopup(tx, onClose){
  const overlay = $('#popup-overlay');
  $('#popup-content').innerHTML = `
    <h3>${tx.type==='send'? t('moneyReceived'):t('moneyDebited')}</h3>
    <p class="big ${tx.type==='send'?'pos':'neg'}">${fmt(tx.amount)}</p>
    ${tx.note? `<p>${tx.note}</p>`:''}
    ${tx.items? renderItemsTable(tx.items):''}
    <p class="muted">${fmtDate(tx.created_at)}</p>
    <button id="popup-ok">${t('ok')}</button>`;
  overlay.classList.remove('hidden');
  $('#popup-ok').onclick = ()=>{ overlay.classList.add('hidden'); onClose(); refreshPersonData(); };
}
$('#person-switch').addEventListener('click', ()=>{
  clearSession();
  if(personChannel) supabase.removeChannel(personChannel);
  show('#view-login');
});

/* ---------------- SERVICE WORKER ---------------- */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

route();
</script>
